      function measureArt(text) {

        return { columns, rows: Math.max(1, lines.length) };

      function terminalMetrics(cssWidth, cssHeight, art) {
        const { columns: artColumns, rows: artRows } = measureArt(art);
        const cols = artColumns + PAD_COLS * 2;
        const rows = artRows + PAD_ROWS * 2;
        const fitWidth = Math.max(1, Math.floor(cssWidth / cols));
        const fitHeight = Math.max(1, Math.floor(cssHeight / (rows * 2)));
        const cellWidth = Math.max(4, Math.min(14, fitWidth, fitHeight));
        const cellHeight = cellWidth * 2;
        return {
          cellWidth,
          cellHeight,
          fontSize: Math.max(1, Math.round(cellHeight / 1.2)),
          columns: cols,
          rows,
          cssWidth,
          cssHeight,
        };

        const dpr = Math.max(1, window.devicePixelRatio || 1);
        target.width = Math.max(1, Math.floor(cssWidth * dpr));
        target.height = Math.max(1, Math.floor(cssHeight * dpr));
        const ctx = target.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        return ctx;
      }

      function staticFrame(metrics, art) {
        const { columns, rows } = metrics;
        const { columns: artColumns, rows: artRows } = measureArt(art);
        const lines = art.split("\n");
        const originCol = Math.floor((columns - artColumns) / 2);
        const originRow = Math.floor((rows - artRows) / 2);
        const count = columns * rows;
        const symbols = new Uint32Array(count).fill(0x20);
        const fg = new Uint32Array(count);
        const bg = new Uint32Array(count);
        const flags = new Uint8Array(count);
        for (let row = 0; row < artRows; row++) {
          const chars = [...(lines[row] ?? "")];
          for (let col = 0; col < chars.length; col++) {
            const x = originCol + col;
            const y = originRow + row;
            if (x < 0 || x >= columns || y < 0 || y >= rows) continue;
            const cp = chars[col].codePointAt(0);
            if (cp === 0x20) continue;
            const index = y * columns + x;
            symbols[index] = cp;
            fg[index] = STATIC_GREEN;
          }
        }
        return { symbols, fg, bg, flags, width: columns, height: rows };
      }

      function paintStatic(ctx, metrics, art) {
        const frame = staticFrame(metrics, art);
        paintFrame(
          ctx,
          metrics,
          frame.symbols,
          frame.fg,
          frame.bg,
          frame.flags,
          frame.width,
          frame.height,
          true,
          FONT_FAMILY,
        );
      }

      let lastPicked = "";
      function pickEffect() {
        const pool = EFFECTS.filter((name) => name !== lastPicked);
        const name = pool[Math.floor(Math.random() * pool.length)];
        lastPicked = name;
        return name;
      }

      let ready = false;
      let ctx = null;
      let metrics = null;
      let session = null;
      let symbols = new Uint32Array();
      let fg = new Uint32Array();
      let bg = new Uint32Array();
      let flags = new Uint8Array();
      let frameWidth = 0;
      let frameHeight = 0;
      let raf = 0;
      let playing = false;
      let lastTs = 0;
      let acc = 0;
      let stepMs = 1000 / DEFAULT_STEPS;
      let holdTimer = 0;

      function layout() {
        const cssWidth = Math.max(1, canvas.clientWidth);
        const cssHeight = Math.max(1, canvas.clientHeight);
        metrics = terminalMetrics(cssWidth, cssHeight, INPUT);
        ctx = sizeCanvas(canvas, cssWidth, cssHeight);
      }

      function stopSession() {
        session?.free();
        session = null;
      }

      function clearHold() {
        if (holdTimer !== 0) {
          clearTimeout(holdTimer);
          holdTimer = 0;
        }
      }

      function queueNext() {
        clearHold();
        holdTimer = setTimeout(() => {
          holdTimer = 0;
          play();
        }, HOLD_MS);
      }

      function capture() {
        if (session == null) return;
        frameWidth = session.width();
        frameHeight = session.height();
        const count = frameWidth * frameHeight;
        if (symbols.length < count) {
          symbols = new Uint32Array(count);
          fg = new Uint32Array(count);
          bg = new Uint32Array(count);
          flags = new Uint8Array(count);
        }
        session.fill(symbols, fg, bg, flags);
      }

      function paintNow(now) {
        if (ctx == null || metrics == null) return;
        paintFrame(
          ctx,
          metrics,
          symbols,
          fg,
          bg,
          flags,
          frameWidth,
          frameHeight,
          Math.floor(now / 400) % 2 === 0,
          FONT_FAMILY,
        );
      }

      function showRest() {
        if (ctx == null || metrics == null) return;
        paintStatic(ctx, metrics, INPUT);
      }

      function tick(now) {
        if (!playing) return;
        acc = Math.min(stepMs * 40, acc + Math.max(0, now - lastTs));
        lastTs = now;
        let alive = true;
        while (acc >= stepMs && session != null) {
          acc -= stepMs;
          alive = session.step();
          if (!alive) break;
        }
        if (session != null) {
          capture();
          paintNow(now);
        }
        if (!alive) {
          playing = false;
          raf = 0;
          stopSession();
          queueNext();
          return;
        }
        raf = requestAnimationFrame(tick);
      }

      function play() {
        if (!ready || metrics == null) return;
        clearHold();
        stopSession();
        if (raf !== 0) {
          cancelAnimationFrame(raf);
          raf = 0;
        }
        const name = pickEffect();
        const rate = STEPS[name] ?? DEFAULT_STEPS;
        stepMs = 1000 / rate;
        session = new Session(
          INPUT,
          name,
          metrics.columns,
          metrics.rows,
          undefined,
          rate,
        );
        if (session.step()) capture();
        playing = true;
        acc = 0;
        lastTs = performance.now();
        raf = requestAnimationFrame(tick);
      }

      function b64ToBytes(b64) {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
      }

      await __wbg_init({ module_or_path: b64ToBytes(TTFX_WASM_B64) });
      layout();
      showRest();
      ready = true;
      play();

      new ResizeObserver(() => {
        const w = canvas.clientWidth;
        const h = canvas.clientHeight;
        if (metrics && w === metrics.cssWidth && h === metrics.cssHeight) return;
        playing = false;
        if (raf !== 0) {
          cancelAnimationFrame(raf);
          raf = 0;
        }
        stopSession();
        layout();
        showRest();
        play();
      }).observe(canvas);

    </script>
  </body>
</html>
